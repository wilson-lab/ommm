[project]
name = "ommm"
version = "0.3.0"
description = "Read and set the MultiClamp 700B through the running MultiClamp Commander"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Stephen Holtz", email = "stephenlholtz@gmail.com" }
]
classifiers = ["Operating System :: Microsoft :: Windows"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/wilson-lab/ommm"

[project.scripts]
ommm = "ommm.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
